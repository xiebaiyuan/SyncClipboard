name: linux-compile

on:
  workflow_call:
    inputs:
      checkout-repo:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        cpu: [x64, arm64]
        type: [self-contained, no-self-contained]
        include:
           - type: self-contained
             ifSelf: "true"
             aotProps: "-p:PublishAot=true -p:TreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true"
           - type: no-self-contained
             ifSelf: "false"
             aotProps: ""

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.checkout-repo }}
        ref: ${{ inputs.checkout-ref }}

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Install dependencies
      working-directory: ./src
      run: dotnet restore SyncClipboard.Desktop.Default

    - name: Build linux-${{ matrix.cpu }}-${{ matrix.type }} 
      run: |
        dotnet publish SyncClipboard.Desktop.Default/SyncClipboard.Desktop.Default.csproj -f net10.0 -r linux-${{ matrix.cpu }} -p:Platform=${{ matrix.cpu }} --self-contained ${{ matrix.ifSelf }} -o ../../linux-${{ matrix.cpu }}-${{ matrix.type }} -c Release ${{ matrix.aotProps }}
      working-directory: ./src

    - name: Upload linux-${{ matrix.cpu }}-${{ matrix.type }}
      uses: actions/upload-artifact@v7
      with:
        name: linux-${{ matrix.cpu }}-${{ matrix.type }}
        path: linux-${{ matrix.cpu }}-${{ matrix.type }}/